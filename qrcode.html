<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>江西省社保基金监督考试题库 - 扫码学习</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.08);
            padding: 40px;
            text-align: center;
            max-width: 420px;
            width: 100%;
        }
        .header {
            margin-bottom: 28px;
        }
        .icon-wrap {
            width: 64px;
            height: 64px;
            background: #1890ff;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            box-shadow: 0 4px 12px rgba(24,144,255,0.3);
        }
        .icon-wrap svg {
            width: 36px;
            height: 36px;
            fill: #fff;
        }
        .title {
            font-size: 20px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 6px;
        }
        .subtitle {
            font-size: 13px;
            color: #888;
        }
        .qrcode-wrap {
            position: relative;
            display: inline-block;
            padding: 16px;
            background: #fff;
            border-radius: 16px;
            border: 2px solid #e8e8e8;
            margin-bottom: 24px;
        }
        #qrcode {
            display: inline-block;
        }
        #qrcode img {
            display: block;
            border-radius: 8px;
        }
        .logo-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 48px;
            height: 48px;
            background: #fff;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border: 2px solid #1890ff;
        }
        .logo-overlay svg {
            width: 28px;
            height: 28px;
            fill: #1890ff;
        }
        .tips {
            background: #e6f7ff;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }
        .tips-title {
            font-size: 14px;
            font-weight: 600;
            color: #1890ff;
            margin-bottom: 8px;
        }
        .tips-list {
            list-style: none;
            text-align: left;
        }
        .tips-list li {
            font-size: 13px;
            color: #555;
            padding: 4px 0;
            padding-left: 18px;
            position: relative;
        }
        .tips-list li::before {
            content: '';
            position: absolute;
            left: 0;
            top: 10px;
            width: 6px;
            height: 6px;
            background: #1890ff;
            border-radius: 50%;
        }
        .url-box {
            background: #f5f5f5;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 12px;
            color: #666;
            word-break: break-all;
            margin-bottom: 16px;
            user-select: all;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-size: 14px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }
        .btn-primary {
            background: #1890ff;
            color: #fff;
        }
        .btn-primary:hover {
            background: #40a9ff;
        }
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        .footer {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #f0f0f0;
        }
        .footer-text {
            font-size: 12px;
            color: #aaa;
        }
        @media print {
            body { background: #fff; }
            .card { box-shadow: none; }
            .btn-group { display: none; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <div class="icon-wrap">
                <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
            </div>
            <div class="title">江西省社保基金监督</div>
            <div class="title">考试题库小程序</div>
            <div class="subtitle">扫码即可在线刷题学习</div>
        </div>

        <div class="qrcode-wrap">
            <div id="qrcode"></div>
            <div class="logo-overlay">
                <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
            </div>
        </div>

        <div class="tips">
            <div class="tips-title">功能介绍</div>
            <ul class="tips-list">
                <li>覆盖养老、失业、工伤保险法规</li>
                <li>单选/多选/判断题全真模拟</li>
                <li>顺序练习、随机刷题、模拟考试</li>
                <li>错题自动收录，随时回顾巩固</li>
                <li>收藏重点题目，针对性学习</li>
            </ul>
        </div>

        <div class="url-box" id="url-text">https://jjjg-lgl.github.io/supervision-question-bank</div>

        <div class="btn-group">
            <button class="btn btn-secondary" onclick="copyUrl()">复制链接</button>
            <button class="btn btn-primary" onclick="window.print()">打印/保存</button>
        </div>


    </div>

    <script>
        const url = 'https://jjjg-lgl.github.io/supervision-question-bank';
        new QRCode(document.getElementById('qrcode'), {
            text: url,
            width: 220,
            height: 220,
            colorDark: '#1a1a1a',
            colorLight: '#ffffff',
            correctLevel: QRCode.CorrectLevel.H
        });

        function copyUrl() {
            navigator.clipboard.writeText(url).then(() => {
                alert('链接已复制到剪贴板');
            }).catch(() => {
                const input = document.createElement('input');
                input.value = url;
                document.body.appendChild(input);
                input.select();
                document.execCommand('copy');
                document.body.removeChild(input);
                alert('链接已复制到剪贴板');
            });
        }
    </script>
</body>
</html>
